# THE DESCENT: game mode (project.cfg `game = on`) switches the sandbox keys off; this file only defines the game's own actions (docs/INPUT.md "Custom actions").
# The mouse and the pad work: LMB attacks, RMB uses the class ability; F and Q are the keyboard twins.
action.attack  = mouse:left, key:f, pad:rt
action.ability = mouse:right, key:q, pad:x
action.quick_heal  = key:r, pad:lb
action.quick_mana  = key:t, pad:rb
action.quick_throw = key:g, pad:y
action.interact = key:e, pad:x
